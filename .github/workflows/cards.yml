name: Update README cards

on:
  schedule:
    - cron: "0 2 * * *"      # daily, 07:30 IST
  workflow_dispatch:          # manual trigger for the first run

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: >-
            username=rishii-hub&show_icons=true&include_all_commits=true&rank_icon=percentile&hide_border=true&bg_color=0d1117&title_color=a371f7&icon_color=a371f7&text_color=c9d1d9&ring_color=a371f7&custom_title=rishi%27s%20GitHub%20Stats

      - name: Top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          path: profile/langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: >-
            username=rishii-hub&layout=compact&langs_count=8&size_weight=0.5&count_weight=0.5&hide=html,css,shell,dockerfile&hide_border=true&bg_color=0d1117&title_color=a371f7&text_color=c9d1d9&card_width=320

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
